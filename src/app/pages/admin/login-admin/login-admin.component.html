<div class="logo-container">
    <img class="logo" src="../../../../assets/logo.png" alt="">
</div>

<div class="form-container">
    <form [formGroup]="loginForm" (ngSubmit)="handleSubmit()">
        <h1 class="headline">:כניסת מנהל</h1>

        <div class="form-text-input">
            <label for="email"> אימייל: </label>
            <input type="text" formControlName="email"
                [ngClass]="{'error-border' : loginForm.get('email').invalid && loginForm.get('email').touched}">
            <div class="error-message" *ngIf="loginForm.get('email').invalid && loginForm.get('email').touched">
                {{emailErrorMessage()}}
            </div>
        </div>

        <div class="form-text-input">
            <label for="password">סיסמא: </label>
            <input type="password" formControlName="password"
                [ngClass]="{'error-border' : loginForm.get('password').invalid && loginForm.get('password').touched}">
            <div class="error-message" *ngIf="loginForm.get('password').invalid && loginForm.get('password').touched">
                יש להכניס סיסמא
            </div>
        </div>

        <button type="submit" [disabled]="loginForm.invalid">כניסה</button>

        <div class="admin-not-exist-modal-container" *ngIf="invalidLogin.adminNotExist || invalidLogin.isUser">
            <div class="admin-not-exist-modal">
                <i class="fas fa-xmark" (click)="onCloseAdminNotExistModal()"></i>
                <span>
                    {{invalidLogin.adminNotExist ? "שם המשתמש ו/או סיסמא אינם קיימים במערכת, אנא וודא שהכנסת את פרטיך
                    באופן תקין" :
                    "הינך מנסה להיכנס כמשתמש, הכניסה למנהלים בלבד"}}
                </span>
            </div>
        </div>
    </form>
</div>
